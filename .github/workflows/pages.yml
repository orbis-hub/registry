name: pages

# site/ + index.json → https://orbis-hub.github.io/registry/
# (so the page can read the index from the same origin, and the pages url works as a registry url too)
on:
  push:
    branches: [main]
    paths: ["site/**", "index.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          cp -r site/. out/
          cp index.json out/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
